name: Build

# Runner windows-2022 sudah membawa WDK 10.1.26100 + ekstensi WDK untuk VS 2022,
# jadi msbuild bisa langsung dipakai tanpa langkah instalasi.
# Lihat: https://github.com/microsoft/Windows-driver-samples/blob/main/.github/Build-with-GitHub.md

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.configuration }} ${{ matrix.platform }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
        platform: [x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: MSBuild ke PATH
        uses: microsoft/setup-msbuild@v2

      - name: Verifikasi toolchain
        shell: pwsh
        continue-on-error: true
        run: |
          msbuild -version
          # Hanya folder bernama versi (10.0.xxxxx.x); folder "wdf" dsb. diabaikan.
          $inc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory |
                 Where-Object { $_.Name -match '^10\.0\.' } |
                 Sort-Object { [version]$_.Name } -Descending
          foreach ($d in $inc) { Write-Host "Kit Include: $($d.Name)" }
          $newest = $inc | Select-Object -First 1
          if ($newest) {
            foreach ($h in @("km\wdm.h", "shared\iddcx.h", "um\windows.h")) {
              $p = Join-Path $newest.FullName $h
              Write-Host ("{0,-20} {1}" -f $h, (Test-Path $p))
            }
          }

      - name: Restore NuGet (kalau ada)
        shell: pwsh
        run: |
          if (Test-Path .\packages.config) { nuget restore .\GameStreamVD.sln }
          else { Write-Host "Tidak ada packages.config, dilewati." }

      - name: Build
        run: >
          msbuild GameStreamVD.sln
          /t:Rebuild
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=${{ matrix.platform }}
          /p:SignMode=Off
          /p:InfVerifEnabled=false
          /m
          /nologo
          /verbosity:normal
          /warnaserror:false

      # ---- DIAGNOSTIK SEMENTARA -------------------------------------------
      # Error C2011/C2382/C2873 (km\crt\new vs MSVC STL) dan C2065 STATUS_WAIT_0
      # menunjukkan tabrakan header kernel vs user-mode. Untuk tahu apakah ini
      # bawaan proyek/env atau akibat perubahan kita, build sampel Microsoft
      # asli apa adanya, dan petakan siapa yang menarik km\crt\new.
      - name: Diagnosa A - build IddSampleDriver asli
        shell: pwsh
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/microsoft/Windows-driver-samples.git D:\wds
          msbuild D:\wds\video\IndirectDisplay\IddSampleDriver.sln `
            /t:Build /p:Configuration=Release /p:Platform=x64 `
            /p:SignMode=Off /p:InfVerifEnabled=false /m /nologo /verbosity:minimal
          Write-Host "EXITCODE Sampel Asli = $LASTEXITCODE"

      - name: Diagnosa B - rantai include km\crt\new
        shell: cmd
        continue-on-error: true
        working-directory: driver\DisplayDriver
        run: |
          cl /nologo /c /showIncludes /D_WIN64 /D_AMD64_ /DAMD64 ^
             /DUMDF_VERSION_MAJOR=2 /DUMDF_VERSION_MINOR=25 ^
             /DUMDF_USING_NTSTATUS /DIDDCX_VERSION_MAJOR=1 /DIDDCX_VERSION_MINOR=6 ^
             /IDRIVER.cpp /Fo%TEMP%\ /showIncludes:tree Driver.cpp > %TEMP%\inc.txt 2>&1
          findstr /n /i "crt\\new km\\crt STATUS_WAIT_0 wudfwdm windows.h iddcx" %TEMP%\inc.txt

      # ---- AKHIR DIAGNOSTIK -----------------------------------------------

      - name: Verifikasi INF (infverif)
        shell: pwsh
        continue-on-error: true
        run: |
          $inf = "driver\DisplayDriver\GsDisplay.inf"
          $verif = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter InfVerif.exe -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          if ($verif) {
            Write-Host "InfVerif: $($verif.FullName)"
            & $verif.FullName $inf
          } else {
            Write-Host "InfVerif.exe tidak ditemukan di image ini - dilewati."
          }

      - name: Ringkasan artefak
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Include *.dll,*.exe,*.inf,*.cat,*.pdb -Path .\build -ErrorAction SilentlyContinue |
            Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload artefak
        uses: actions/upload-artifact@v4
        with:
          name: GameStreamVD-${{ matrix.configuration }}-${{ matrix.platform }}
          path: |
            build/**/*.dll
            build/**/*.exe
            build/**/*.pdb
            driver/DisplayDriver/GsDisplay.inf
          if-no-files-found: warn

  # Uji unit portabel (generator EDID) di Linux - cepat dan tidak butuh WDK.
  edid-test:
    name: Unit test EDID
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & jalankan test
        working-directory: tests
        run: |
          g++ -std=c++17 -Wall -Wextra -I .. -I shim -o test_edid test_edid.cpp
          ./test_edid
