name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.configuration }} ${{ matrix.platform }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
        platform: [x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: MSBuild ke PATH
        uses: microsoft/setup-msbuild@v2

      - name: Verifikasi toolchain
        shell: pwsh
        run: |
          msbuild -version
          # Hanya folder bernama versi (10.0.xxxxx.x); folder "wdf" dsb. diabaikan.
          $inc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory |
                 Where-Object { $_.Name -match '^10\.0\.' } |
                 Sort-Object { [version]$_.Name } -Descending
          foreach ($d in $inc) { Write-Host "Kit Include: $($d.Name)" }

      - name: Restore NuGet (kalau ada)
        shell: pwsh
        run: |
          if (Test-Path .\packages.config) { nuget restore .\GameStreamVD.sln }

      - name: Build
        run: >
          msbuild GameStreamVD.sln /t:Rebuild
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=${{ matrix.platform }}
          /p:SignMode=Off
          /nologo /verbosity:minimal /maxcpucount

      - name: Verifikasi INF (infverif)
        shell: pwsh
        continue-on-error: true
        run: |
          $inf = "driver\DisplayDriver\GsDisplay.inf"
          $verif = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter InfVerif.exe -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          if ($verif) {
            Write-Host "InfVerif: $($verif.FullName)"
            & $verif.FullName $inf
          } else {
            Write-Host "InfVerif.exe tidak ada di image ini - dilewati."
          }

      - name: Ringkasan artefak
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -File -Include *.dll,*.exe,*.inf,*.cat -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\\.git\\' } |
            Select-Object FullName, Length | Format-Table -AutoSize

      # "Build succeeded" saja tidak cukup - pastikan biner benar-benar terbentuk.
      - name: Cek hasil build ada
        shell: pwsh
        run: |
          $ok = $true
          $expect = @(
            "x64\${{ matrix.configuration }}\GsDisplay.dll",
            "build\x64\${{ matrix.configuration }}\GsDevCtl.exe"
          )
          foreach ($f in $expect) {
            if (Test-Path $f) {
              $len = (Get-Item $f).Length
              Write-Host ("OK      {0}  ({1} byte)" -f $f, $len)
              if ($len -lt 4096) { $ok = $false }
            } else {
              Write-Host ("HILANG  {0}" -f $f)
              $ok = $false
            }
          }
          if (-not $ok) { throw "Ada keluaran build yang tidak dihasilkan." }

      # Driver UMDF tanpa tanda tangan ditolak Windows x64 (Device Manager
      # Code 52) dan monitor tidak akan pernah muncul. Build di atas memakai
      # /p:SignMode=Off, jadi penandatanganan dilakukan di sini.
      - name: Tanda tangani dengan sertifikat uji coba
        shell: pwsh
        run: |
          .\tools\Sign-Test.ps1 -Configuration ${{ matrix.configuration }} `
                                -Platform ${{ matrix.platform }}

      - name: Upload artefak
        uses: actions/upload-artifact@v4
        with:
          name: GameStreamVD-${{ matrix.configuration }}-${{ matrix.platform }}
          path: |
            x64/${{ matrix.configuration }}/GsDisplay.dll
            x64/${{ matrix.configuration }}/GsDisplay.inf
            x64/${{ matrix.configuration }}/GsDisplay.cat
            x64/${{ matrix.configuration }}/GsDisplay.pdb
            x64/${{ matrix.configuration }}/gsvd-test.cer
            build/**/*.exe
            build/**/*.pdb
            tools/install.bat
            tools/Diagnose.ps1
          if-no-files-found: error

  # Uji unit portabel (generator EDID) di Linux - cepat dan tidak butuh WDK.
  edid-test:
    name: Unit test EDID
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & jalankan test
        run: |
          g++ -std=c++17 -Wall -Wextra -I tests/shim -I . -I include -I driver/DisplayDriver \
              tests/test_edid.cpp -o /tmp/test_edid
          /tmp/test_edid
