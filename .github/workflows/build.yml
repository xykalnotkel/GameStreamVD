name: Build

# Runner windows-2022 sudah membawa WDK 10.1.26100 + ekstensi WDK untuk VS 2022,
# jadi msbuild bisa langsung dipakai tanpa langkah instalasi.
# Lihat: https://github.com/microsoft/Windows-driver-samples/blob/main/.github/Build-with-GitHub.md

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.configuration }} ${{ matrix.platform }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
        platform: [x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: MSBuild ke PATH
        uses: microsoft/setup-msbuild@v2

      - name: Verifikasi toolchain
        shell: pwsh
        continue-on-error: true
        run: |
          msbuild -version
          # Hanya folder bernama versi (10.0.xxxxx.x); folder "wdf" dsb. diabaikan.
          $inc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory |
                 Where-Object { $_.Name -match '^10\.0\.' } |
                 Sort-Object { [version]$_.Name } -Descending
          foreach ($d in $inc) { Write-Host "Kit Include: $($d.Name)" }
          $newest = $inc | Select-Object -First 1
          if ($newest) {
            foreach ($h in @("km\wdm.h", "shared\iddcx.h", "um\windows.h")) {
              $p = Join-Path $newest.FullName $h
              Write-Host ("{0,-20} {1}" -f $h, (Test-Path $p))
            }
          }

      # ---- EKSPERIMEN: pisahkan penyebab tabrakan header -------------------
      # ProbeA = driver UMDF minimal, tanpa header proyek apa pun.
      # ProbeB = ProbeA + GsVirtual.h pada posisi yang sama seperti Driver.h.
      #   A gagal            -> masalah konfigurasi proyek / environment.
      #   A sukses, B gagal  -> masalahnya GsVirtual.h.
      #   dua-duanya sukses  -> masalahnya di Driver.h/Driver.cpp/FrameSink.
      - name: Probe A - driver UMDF minimal
        continue-on-error: true
        run: >
          msbuild ci-probe\ProbeA.vcxproj /t:Rebuild
          /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off
          /p:InfVerifEnabled=false /nologo /verbosity:minimal

      - name: Probe B - minimal + GsVirtual.h
        continue-on-error: true
        run: >
          msbuild ci-probe\ProbeB.vcxproj /t:Rebuild
          /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off
          /p:InfVerifEnabled=false /nologo /verbosity:minimal

      # ---- AKHIR EKSPERIMEN -----------------------------------------------


      - name: Restore NuGet (kalau ada)
        shell: pwsh
        run: |
          if (Test-Path .\packages.config) { nuget restore .\GameStreamVD.sln }
          else { Write-Host "Tidak ada packages.config, dilewati." }

      - name: Build
        run: >
          msbuild GameStreamVD.sln
          /t:Rebuild
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=${{ matrix.platform }}
          /p:SignMode=Off
          /p:InfVerifEnabled=false
          /m
          /nologo
          /verbosity:normal
          /warnaserror:false


      - name: Verifikasi INF (infverif)
        shell: pwsh
        continue-on-error: true
        run: |
          $inf = "driver\DisplayDriver\GsDisplay.inf"
          $verif = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter InfVerif.exe -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          if ($verif) {
            Write-Host "InfVerif: $($verif.FullName)"
            & $verif.FullName $inf
          } else {
            Write-Host "InfVerif.exe tidak ditemukan di image ini - dilewati."
          }

      - name: Ringkasan artefak
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Include *.dll,*.exe,*.inf,*.cat,*.pdb -Path .\build -ErrorAction SilentlyContinue |
            Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload artefak
        uses: actions/upload-artifact@v4
        with:
          name: GameStreamVD-${{ matrix.configuration }}-${{ matrix.platform }}
          path: |
            build/**/*.dll
            build/**/*.exe
            build/**/*.pdb
            driver/DisplayDriver/GsDisplay.inf
          if-no-files-found: warn

  # Uji unit portabel (generator EDID) di Linux - cepat dan tidak butuh WDK.
  edid-test:
    name: Unit test EDID
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & jalankan test
        working-directory: tests
        run: |
          g++ -std=c++17 -Wall -Wextra -I .. -I shim -o test_edid test_edid.cpp
          ./test_edid
